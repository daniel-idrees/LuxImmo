name: CI

on:
  push:
    branches:
      - main

  pull_request:
    types: [ opened, reopened, synchronize ]
    branches:
      - main

# Least-privilege token: this workflow only reads the repo and uploads artifacts.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  main_project_module: app
  # Baked into core:network BuildConfig.BASE_URL at configuration time, so it is
  # needed by every job that compiles (lint/test/build). Optional: when unset it
  # resolves to blank, which the app handles via demo mode.
  BASE_URL: ${{ secrets.BASE_URL }}

jobs:
  linting:
    name: Run Lint Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout the code
        uses: actions/checkout@v5

      - name: Setup Java and Gradle
        uses: ./.github/actions/job-set-up

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Upload Lint Report
        # always() so the report is uploaded even when lint fails — which is
        # exactly when it is most useful.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: ${{ github.workspace }}/**/build/reports/lint-results-*.html
          retention-days: 14

  unit_test:
    name: Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout the code
        uses: actions/checkout@v5

      - name: Setup Java and Gradle
        uses: ./.github/actions/job-set-up

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: ${{ github.workspace }}/**/build/reports/tests/
          retention-days: 14

  ui_test:
    name: UI Tests (Instrumented)
    needs: [ linting, unit_test ]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # main branch only: instrumented UI tests need an emulator and are slower and
    # flakier than the JVM checks, so PRs stay gated on lint + unit tests and the
    # full on-device suite runs once the change has landed on main.
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout the code
        uses: actions/checkout@v5

      - name: Setup Java and Gradle
        uses: ./.github/actions/job-set-up

      # The Android emulator needs KVM hardware acceleration to run at a usable
      # speed on the ubuntu-latest runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Boots an emulator, waits for it, then runs the connected (androidTest)
      # suite. api-level must be >= the app's minSdk (24); 34 is a stable, widely
      # cached system image and can be raised toward targetSdk (36) over time.
      - name: Run Instrumented (UI) Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload Instrumented Test Report
        # always() so the report is uploaded even when a UI test fails — which is
        # exactly when it is most useful.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: ${{ github.workspace }}/**/build/reports/androidTests/
          retention-days: 14

  build_and_upload:
    name: Build and Upload
    needs: [ linting, unit_test, ui_test ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ui_test is in needs so a failing UI test on main blocks the APK. But ui_test
    # is main-only and is skipped on PRs; a skipped dependency would normally skip
    # this job too. This guard lets it still run when ui_test was skipped, while
    # keeping it blocked if any dependency actually failed or the run was cancelled.
    if: ${{ !cancelled() && !failure() }}

    steps:
      - name: Checkout the code
        uses: actions/checkout@v5

      - name: Setup Java and Gradle
        uses: ./.github/actions/job-set-up

      # Set Current Date As Env Variable
      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # Set Repository Name As Env Variable
      - name: Set repository name as env variable
        run: echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      # Create APK
      - name: Build apk - ${{ env.main_project_module }} module
        run: ./gradlew assembleDebug

      # Upload Artifact Build
      # Noted For Output [main_project_module]/build/outputs/apk/debug/
      # PRs still assemble above (the real gate); only main produces a
      # downloadable APK, so PRs don't generate throwaway artifacts.
      - name: Upload APK - ${{ env.repository_name }}
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date_today }} - ${{ env.repository_name }} - APK(s) dev debug generated
          path: ${{ env.main_project_module }}/build/outputs/apk/debug/
          retention-days: 14
