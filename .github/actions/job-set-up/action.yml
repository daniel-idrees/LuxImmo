name: Job set up
description: Sets up the Java and Gradle

runs:
  using: "composite"
  steps:

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: 'temurin'

  - name: Grant execute permission for gradlew
    shell: bash
    run: chmod +x gradlew

  # Configures Gradle and handles caching of ~/.gradle and the configuration
  # cache automatically (read-only on non-default branches). No separate
  # actions/cache step is needed — that would duplicate and thrash this cache.
  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: 'wrapper'
      validate-wrappers: true
      gradle-home-cache-cleanup: true
